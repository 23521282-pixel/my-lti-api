<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LTI Quiz Tool</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Quiz Tool</h1>
      <div id="user-info" class="user-badge">Loading user...</div>
    </header>

    <div id="error-message" class="error-banner" style="display: none;"></div>

    <!-- VIEW 1: Quiz List -->
    <div id="quizzes-view">
      <h2 style="margin-bottom: 16px;">Available Quizzes</h2>
      <div id="quizzes-list" class="loading">Loading quizzes...</div>
    </div>

    <!-- VIEW 2: Active Quiz -->
    <div id="quiz-view" style="display: none;">
      <div class="card">
        <h2 id="quiz-title"></h2>
        <p id="quiz-description"></p>
        <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border);" />

        <form id="quiz-form">
          <div id="questions-container"></div>
          <div style="margin-top: 24px;">
            <button type="button" class="btn btn-secondary" onclick="showQuizList()">Back to Quizzes</button>
            <button type="submit" class="btn" id="submit-btn">Submit Quiz</button>
          </div>
        </form>
      </div>
    </div>

    <!-- VIEW 3: Result -->
    <div id="result-view" style="display: none;">
      <div class="card result-card">
        <div id="result-badge" class="result-badge"></div>
        <div id="result-score" class="score-display"></div>
        <div id="result-percentage" class="percentage-text"></div>
        <button type="button" class="btn" onclick="showQuizList()">Back to Quizzes</button>
      </div>
    </div>
  </div>

  <script>
    let currentQuizId = null;

    async function init() {
      try {
        // 1. Fetch current authenticated user
        const userRes = await fetch("/api/me");
        if (!userRes.ok) {
          showError("Not authenticated. Please launch this tool from Cohota LMS.");
          document.getElementById("user-info").innerText = "Not Authenticated";
          return;
        }
        const userData = await userRes.json();
        const userName = userData.user?.name || userData.user?.givenName || "Student";
        document.getElementById("user-info").innerText = `Hello, ${userName}`;

        // 2. Load quizzes
        await loadQuizzes();
      } catch (err) {
        showError("Failed to initialize session: " + err.message);
      }
    }

    async function loadQuizzes() {
      const listEl = document.getElementById("quizzes-list");
      listEl.innerHTML = "Loading quizzes...";

      try {
        const res = await fetch("/api/quizzes");
        if (!res.ok) {
          throw new Error("Unable to load quizzes (status: " + res.status + ")");
        }

        const quizzes = await res.json();
        if (!quizzes.length) {
          listEl.innerHTML = "<p>No quizzes available right now.</p>";
          return;
        }

        listEl.innerHTML = "";
        quizzes.forEach((quiz) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <h2>${escapeHtml(quiz.title)}</h2>
            <p>${escapeHtml(quiz.description)}</p>
            <button class="btn" onclick="startQuiz('${escapeHtml(quiz.id)}')">Start</button>
          `;
          listEl.appendChild(card);
        });
      } catch (err) {
        listEl.innerHTML = `<p style="color: var(--danger)">Error loading quizzes: ${escapeHtml(err.message)}</p>`;
      }
    }

    async function startQuiz(quizId) {
      currentQuizId = quizId;
      hideError();

      try {
        const res = await fetch(`/api/quizzes/${quizId}`);
        if (!res.ok) {
          throw new Error("Failed to load quiz details.");
        }

        const quiz = await res.json();
        document.getElementById("quiz-title").innerText = quiz.title;
        document.getElementById("quiz-description").innerText = quiz.description;

        const questionsContainer = document.getElementById("questions-container");
        questionsContainer.innerHTML = "";

        quiz.questions.forEach((q, idx) => {
          const qBlock = document.createElement("div");
          qBlock.className = "question-block";

          const qTitle = document.createElement("div");
          qTitle.className = "question-text";
          qTitle.innerText = `${idx + 1}. ${q.question}`;
          qBlock.appendChild(qTitle);

          q.options.forEach((opt) => {
            const label = document.createElement("label");
            label.className = "option-label";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = `question_${q.id}`;
            // Extract choice indicator (e.g., "A" from "A. Option" or whole option)
            const choiceMatch = opt.match(/^([A-Za-z0-9]+)[\.\:]/);
            radio.value = choiceMatch ? choiceMatch[1] : opt;

            const span = document.createElement("span");
            span.innerText = opt;

            label.appendChild(radio);
            label.appendChild(span);
            qBlock.appendChild(label);
          });

          questionsContainer.appendChild(qBlock);
        });

        document.getElementById("quizzes-view").style.display = "none";
        document.getElementById("result-view").style.display = "none";
        document.getElementById("quiz-view").style.display = "block";
      } catch (err) {
        showError(err.message);
      }
    }

    document.getElementById("quiz-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentQuizId) return;

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      try {
        const form = e.target;
        const answers = [];

        // Collect answers
        const questionBlocks = document.querySelectorAll(".question-block");
        questionBlocks.forEach((block) => {
          const checked = block.querySelector("input[type='radio']:checked");
          if (checked) {
            const questionId = checked.name.replace("question_", "");
            answers.push({
              questionId,
              answer: checked.value
            });
          }
        });

        const res = await fetch(`/api/quizzes/${currentQuizId}/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ answers })
        });

        if (!res.ok) {
          throw new Error("Quiz submission failed with status: " + res.status);
        }

        const result = await res.json();
        showResult(result);
      } catch (err) {
        showError("Submission error: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Quiz";
      }
    });

    function showResult(result) {
      document.getElementById("quiz-view").style.display = "none";
      document.getElementById("quizzes-view").style.display = "none";

      const badge = document.getElementById("result-badge");
      if (result.passed) {
        badge.className = "result-badge result-passed";
        badge.innerText = "PASSED";
      } else {
        badge.className = "result-badge result-failed";
        badge.innerText = "NOT PASSED";
      }

      document.getElementById("result-score").innerText = `${result.score} / ${result.maxScore}`;
      document.getElementById("result-percentage").innerText = `Score: ${result.percentage}%`;

      document.getElementById("result-view").style.display = "block";
    }

    function showQuizList() {
      document.getElementById("quiz-view").style.display = "none";
      document.getElementById("result-view").style.display = "none";
      document.getElementById("quizzes-view").style.display = "block";
      hideError();
    }

    function showError(msg) {
      const errEl = document.getElementById("error-message");
      errEl.innerText = msg;
      errEl.style.display = "block";
    }

    function hideError() {
      document.getElementById("error-message").style.display = "none";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text || "";
      return div.innerHTML;
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
